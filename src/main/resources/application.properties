spring.application.name=tareas-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tareas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
springdoc.swagger-ui.path=/swagger-ui.html
security.jwt.secret=${JWT_SECRET:local-development-secret-key-change-me-32-chars-minimum}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
